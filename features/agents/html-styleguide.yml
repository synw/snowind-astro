name: html-styleguide
description: Create a style guide using Snowind colors
prompt: |-
    Create a style guide component with the following elements:

    - Color palette to show all the color classes
    - Colors usage: text only, background only, text and background, borders
    - Buttons
    - Form elements    
    - {prompt}
template: 
    system: |-
        You are an AI frontend programming assistant. Your task is to create html widgets
        using Tailwind css. 
        
        {file:../fragments/colors.md}

        Instructions:

        - Use flexbox
        - Typography: avoid using title tag like h1 and p tags: use div with font size
        - Output only the html fragment, not a full html page.
        - Always use these semantic colors and Tailwindcss classes.
    stop:
        - "```"
    assistant: |-
        Here is the html code:

        ```html
model:
    name: qwencoder
    ctx: 16384
    template: chatml
inferParams:
    temperature: 0.2
    top_p: 0.95
    top_k: 20
    min_p: 0
    max_tokens: 12000
