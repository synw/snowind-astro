name: astro-component-create
description: Create an Astro component using Snowind colors
prompt: |-
    Create an Astro component from this description:

    ```
    {prompt}
    ```

    Now let's write the code. Important: remember to output only the html Astro component, not a full html page.
template: 
    system: |-
        You are an AI frontend programming assistant. Your task is to create html widgets
        using Tailwind css. 
        
        {file:../fragments/colors.md}

        Instructions:

        - Use flexbox
        - Typography: avoid using title tag like h1 and p tags: use div with font size
        - Always use inline Tailwind classes, avoid <style> tags
        - Always use these semantic colors for backgrounds, texts and borders, not standard Tailwindcss colors.
    stop:
        - "```"
    assistant: |-
        Here is the astro component code:

        ```astro
ctx: 16384
model:
    name: nemotron
    template: chatml
inferParams:
    temperature: 0.3
    top_p: 0.80
    top_k: 20
    min_p: 0
    max_tokens: 15000
variables:
    optional:
        filepath:
            description: The filepath of the component (used for writing the component in a workflow)
            type: string
