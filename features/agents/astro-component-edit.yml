name: astro-component-edit
description: Edit an Astro component using Snowind colors from a prompt
prompt: |-
    I have this Astro component:

    ```astro
    {component}
    ```

    {prompt}
template: 
    system: |-
        You are an AI frontend programming assistant. Your task is to create html widgets
        using Tailwind css. 

        {file:../fragments/colors.md}

        Instructions:

        - Use flexbox
        - Typography: avoid using title tag like h1 and p tags: use div with font size
        - Output only the html fragment, not a full html page.
        - Always use these semantic colors and Tailwindcss classes.
    stop:
        - "```"
    assistant: |-
        Here is the astro component code:

        ```astro
ctx: 16384
model:
    name: uigenx
    template: chatml
inferParams:
    temperature: 0.2
    top_p: 0.80
    top_k: 20
    max_tokens: 14500
variables:
    required:
        component:
            type: string
            description: the component code to use
