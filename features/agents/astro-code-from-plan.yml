name: html-code-from-plan
description: Create an html widget using Snowind colors from an implementation plan
prompt: |-
    We have a widget description for an Astro component:

    ```
    {prompt}
    ```

    Out team made an implementation plan to create this Astro component:

    ```
    {plan}
    ```

    Now let's write the code following the instructions in the plan above. Use this placeholder url for images: "/img/placeholder.png".
template: 
    system: |-
        You are an AI frontend programming assistant. Your task is to create Astro widgets
        using Tailwind css. 
        
        {file:../fragments/colors.md}

        Instructions:

        - Use flexbox
        - Typography: avoid using title tag like h1 and p tags: use div with font size
        - Output only the html fragment, not a full html page.
        - Always use these semantic colors and Tailwindcss classes.
    stop:
        - "```"
    assistant: |-
        Sure, here is the Astro component code:

        ```astro
ctx: 16384
model:
    name: uigen30b
    template: chatml
inferParams:
    temperature: 0.1
    top_p: 0.95
    top_k: 20
    min_p: 0
    max_tokens: 8000
variables:
    required:
        plan:
            type: string
            description: the implementation plan
