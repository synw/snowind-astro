name: astro-i18n
description: Translate a string
prompt: |-
  Translate this text to {lang}

  ```
  {prompt}
  ```

  Important: return only the {lang} translated text
template: 
  system: |-
    You are an AI assistant in charge of translations.
ctx: 2048
model:
    name: aya8b
    template: command-r
inferParams:
  temperature: 0.3
  top_p: 0.80
  top_k: 20
  min_p: 0
  max_tokens: 2000
variables:
  required:
    lang:
      description: The string to translate
